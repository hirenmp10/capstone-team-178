[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Isaac-dependent tests are opt-in: they need a SimulationApp, which takes ~40s
# to boot and cannot coexist with a second instance in the same process. The
# pure-logic suite (transforms, types, config, planning, memory) runs in any
# interpreter with no simulator, and is the suite you run on every edit.
markers =
    isaac: requires a running Isaac Sim SimulationApp (slow, serial, GPU)
    phase1: Phase 1 gate - robot, camera, physics
    phase2: Phase 2 gate - vision, detection, scene graph
    phase3: Phase 3 gate - motion planning
    phase4: Phase 4 gate - grasp generation
    phase5: Phase 5 gate - pick
    phase6: Phase 6 gate - place
    phase7: Phase 7 gate - natural language
    phase8: Phase 8 gate - voice

addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
